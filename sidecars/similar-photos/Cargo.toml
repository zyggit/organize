[package]
name = "similar-photos"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "MIT sidecar that finds exact and perceptually similar photos with czkawka_core"

[[bin]]
name = "similar-photos"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
czkawka_core = "=12.0.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.13"
