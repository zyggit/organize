name: Desktop installer

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build macOS Apple Silicon
    runs-on: macos-14
    timeout-minutes: 60
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/build/python-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.23'
          enable-cache: false
      - name: Prepare Rust and check native architecture
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          test "$(rustc --print host-tuple)" = aarch64-apple-darwin
          cargo fetch --locked --target aarch64-apple-darwin --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Install locked dependencies
        run: |
          npm ci --prefix apps/desktop
          # Standalone runtime avoids upstream Framework __FILE__ home paths.
          uv python install --no-bin 3.11.15
          uv venv --seed --managed-python --python 3.11.15 build/desktop-python
          build/desktop-python/bin/python -m pip install -r scripts/desktop-build-requirements.txt
          build/desktop-python/bin/python -m pip install --no-deps --no-build-isolation -e .
          build/desktop-python/bin/python -m pip check
      - name: Regression tests
        run: |
          build/desktop-python/bin/python scripts/check-release-privacy.py --source
          build/desktop-python/bin/python scripts/test-release-privacy.py
          npm test --prefix apps/desktop
          npm run typecheck --prefix apps/desktop
          build/desktop-python/bin/python -m unittest discover -s engine/tests -v
          build/desktop-python/bin/python -m pytest tests
          build/desktop-python/bin/python scripts/test-desktop-release.py
      - name: Build installer and offline license bundle
        working-directory: apps/desktop
        run: npm run bundle:macos -- --ci
      - name: Rust regression tests (requires the generated sidecar)
        run: cargo test --locked --offline --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Verify installer, frozen engine and legal resources
        run: |
          build/desktop-python/bin/python scripts/test-license-bundle.py
          build/desktop-python/bin/python scripts/prepare-desktop-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organize-macos-arm64
          path: |
            build/desktop-release/Organize-macos-arm64.dmg
            build/desktop-release/SHA256SUMS.txt
            build/desktop-release/build-info.json
            build/desktop-release/privacy-audit.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub download
    needs: build
    # PRs (including fork PRs) only test/build. Manual publishing is primary-branch-only.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: organize-macos-arm64
          path: build/desktop-release/
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-desktop-release.sh
