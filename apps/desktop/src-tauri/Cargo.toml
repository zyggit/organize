[package]
name = "organize-desktop"
version = "0.1.0"
description = "Safe file organization desktop app"
authors = ["organize contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "organize_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
